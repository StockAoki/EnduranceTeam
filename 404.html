<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Endurance Team CR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .logo {
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        h1 {
            font-size: 120px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2D9D8D 0%, #3DBDAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h2 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #b0b0b0;
        }
        
        .btn-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            background: #2D9D8D;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 2px solid #2D9D8D;
        }
        
        .btn:hover {
            background: #3DBDAA;
            border-color: #3DBDAA;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(45, 157, 141, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #2D9D8D;
            color: #2D9D8D;
        }
        
        .btn-secondary:hover {
            background: rgba(45, 157, 141, 0.1);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 80px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
            
            .btn-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="#2D9D8D" stroke-width="4"/>
                <path d="M30 50 L45 65 L70 35" stroke="#2D9D8D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <h1>404</h1>
        <h2>¡Ups! Esta ruta no existe</h2>
        <p>Parece que te has desviado del camino. No encontramos la página que buscas, pero podemos ayudarte a retomar el entrenamiento.</p>
        
        <div class="btn-container">
            <a href="/" class="btn">Volver al inicio</a>

        </div>
    </div>
</body>
</html>
